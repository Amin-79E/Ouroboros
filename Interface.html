<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ouroboros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0514;
    --panel: #130b24;
    --ink: #efe8fb;
    --muted: #9a8bb8;
    --line: #2d1d4e;
    --accent: #8957e5;
    --accent-2: #a371f7;
    --pop: #ea80fc;
    --user-a: #5b34b0;
    --user-b: #8957e5;
    --code-bg: #07030f;
    --warn: #ff7a9c;
    --ok: #7ee2b0;
    --mono: "JetBrains Mono", Consolas, "Cascadia Mono", monospace;
    --script: Cinzel, "Trajan Pro", Georgia, "Times New Roman", serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink);
    font: 16px/1.6 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex; flex-direction: column;
    background:
      radial-gradient(900px 560px at 88% -8%, rgba(137,87,229,.2), transparent 62%),
      radial-gradient(800px 600px at -10% 108%, rgba(234,128,252,.14), transparent 62%),
      radial-gradient(760px 540px at -8% -6%, rgba(163,113,247,.12), transparent 62%),
      radial-gradient(760px 540px at 108% 106%, rgba(234,128,252,.11), transparent 62%),
      var(--bg);
    background-attachment: fixed;
  }
  :focus-visible { outline: 2px solid var(--pop); outline-offset: 2px; }
  button, select, input, textarea { font: inherit; color: inherit; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(10,5,20,.7);
    backdrop-filter: blur(10px);
    position: relative; z-index: 2;
  }
  header h1 {
    font: 600 22px/1 var(--script); letter-spacing: .08em; margin: 0; padding: 2px 4px 5px;
    background: linear-gradient(90deg, var(--accent-2), var(--pop));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .spacer { flex: 1; }
  select, input[type="text"], input[type="number"] {
    background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  select option { background: var(--panel); }
  button {
    background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 13px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  button:hover { border-color: var(--accent-2); background: rgba(137,87,229,.15); }
  button.primary {
    background: linear-gradient(90deg, var(--accent), var(--pop)); border: 0; color: #fff; font-weight: 600;
    padding: 8px 18px; border-radius: 999px;
  }
  button.primary:hover { filter: brightness(1.1); }
  button:disabled { opacity: .45; cursor: default; }
  .new-btn { display: inline-flex; align-items: center; gap: 6px; height: 38px; border-radius: 10px; color: var(--accent-2); }
  .new-btn:hover { color: var(--pop); }
  .icon-btn { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; border-radius: 10px; color: var(--accent-2); }
  .icon-btn:hover { color: var(--pop); }

  /* ---------- ring ---------- */
  .ring { display: block; filter: drop-shadow(0 0 14px rgba(137,87,229,.55)); animation: turn 70s linear infinite; }
  .busy .ring.live, .ring.spin { animation-duration: 2.8s; }
  @keyframes turn { to { transform: rotate(360deg); } }

  /* ---------- thread ---------- */
  main { flex: 1; overflow-y: auto; padding: 24px 20px 150px; scroll-behavior: smooth; }
  .thread { max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  .hero { text-align: center; margin-top: 7vh; }
  .hero .big { position: relative; width: 230px; height: 230px; margin: 0 auto 18px; }
  .hero .big svg { width: 100%; height: 100%; }
  .hero .big::before { content: ""; position: absolute; inset: -50%; pointer-events: none; background: radial-gradient(circle, rgba(137,87,229,.22), rgba(234,128,252,.06) 42%, transparent 68%); }
  .hero .big img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 18px rgba(163,113,247,.42)) drop-shadow(0 0 50px rgba(137,87,229,.3)); }
  .hero .core {
    position: absolute; inset: 0; display: grid; place-items: center;
    font: 500 30px var(--mono); color: var(--accent-2); text-shadow: 0 0 18px var(--accent);
  }
  .hero h2 { font: 600 38px/1.15 var(--script); letter-spacing: .1em; margin: 0 0 8px; padding-bottom: 8px;
    background: linear-gradient(90deg, var(--accent-2), var(--pop)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: var(--muted); margin: 0 auto 22px; max-width: 460px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    border-radius: 999px; padding: 7px 15px; border: 1px solid var(--accent);
    background: rgba(137,87,229,.12); color: var(--ink); font-size: 14px;
  }
  .chip:hover { background: rgba(137,87,229,.32); }

  .msg.user {
    align-self: flex-end; max-width: 82%;
    background: linear-gradient(135deg, var(--user-a), var(--user-b));
    padding: 10px 16px; border-radius: 18px 18px 4px 18px;
    box-shadow: 0 6px 24px rgba(137,87,229,.25);
  }
  .msg.assistant { display: block; }
  .msg.assistant .body { padding-left: 14px; border-left: 2px solid; border-image: linear-gradient(180deg, var(--accent), transparent) 1; min-width: 0; }
  .msg p { margin: 0 0 .75em; }
  .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 0 0 .75em; padding-left: 1.3em; }
  .msg strong { color: var(--pop); }
  .msg code.inline {
    font: .9em var(--mono); color: var(--pop); background: rgba(234,128,252,.1);
    border: 1px solid rgba(234,128,252,.25); border-radius: 5px; padding: 1px 5px;
  }
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .error { color: var(--warn); }

  .think { display: inline-flex; gap: 5px; padding: 8px 0; }
  .think i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2); animation: pulse 1.1s ease-in-out infinite; }
  .think i:nth-child(2) { animation-delay: .15s; } .think i:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }

  /* ---------- code ---------- */
  .codeblock { margin: .5em 0 .9em; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
  .codeblock .bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px 4px 14px; background: rgba(137,87,229,.12); border-bottom: 1px solid var(--line);
    font: 12px var(--mono); color: var(--accent-2);
  }
  .codeblock .copy { font-size: 12px; padding: 2px 10px; border-radius: 6px; }
  .codeblock pre { margin: 0; padding: 12px 16px; overflow-x: auto; font: 13.5px/1.55 var(--mono); color: #e7def8; tab-size: 4; }
  .t-k { color: #c792ff; } .t-s { color: #8fe3b0; } .t-c { color: #7a6a9a; font-style: italic; }
  .t-n { color: #ffb86b; } .t-f { color: #7fb4ff; } .t-b { color: #ff8fd0; }

  /* ---------- composer ---------- */
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 40px 20px 18px; z-index: 3; pointer-events: none;
    background: linear-gradient(180deg, transparent, var(--bg) 55%);
  }
  .composer {
    pointer-events: auto; max-width: 840px; margin: 0 auto;
    background: rgba(19,11,36,.92); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 20px; padding: 10px;
    transition: border-color .2s, box-shadow .2s;
  }
  .composer:focus-within { border-color: var(--accent-2); box-shadow: 0 0 0 4px rgba(137,87,229,.2), 0 10px 40px rgba(137,87,229,.25); }
  .attach { display: none; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 4px 10px; }
  .attach.open { display: grid; }
  .attach label { display: block; font-size: 12px; color: var(--accent-2); margin: 0 0 4px 2px; }
  textarea {
    width: 100%; resize: none; background: transparent; border: 0; outline: 0; padding: 8px 10px;
  }
  .attach textarea {
    resize: vertical; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
    font: 13px/1.5 var(--mono); min-height: 120px;
  }
  .attach textarea:focus { border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row textarea { min-height: 42px; max-height: 200px; }
  .row .ghost { border-radius: 999px; white-space: nowrap; }
  @media (max-width: 640px) { .attach.open { grid-template-columns: 1fr; } }

  /* ---------- history drawer ---------- */
  #scrim { position: fixed; inset: 0; background: rgba(5,2,12,.6); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; }
  #scrim.open { opacity: 1; pointer-events: auto; }
  #drawer {
    position: fixed; top: 0; bottom: 0; left: 0; width: min(340px, 90vw); z-index: 10;
    background: var(--panel); border-right: 1px solid var(--accent);
    box-shadow: 10px 0 60px rgba(137,87,229,.3);
    transform: translateX(-102%); transition: transform .25s ease;
    display: flex; flex-direction: column; gap: 12px; padding: 16px;
  }
  #drawer.open { transform: translateX(0); }
  .dhead { display: flex; align-items: center; justify-content: space-between; }
  .dhead h2 { margin: 0; font: 600 20px var(--script); letter-spacing: .08em; color: var(--pop); }
  #drawer .primary { width: 100%; }
  #chatList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin: 0 -4px; padding: 0 4px; }
  .dempty { color: var(--muted); font-size: 14px; margin: 8px 2px; }
  .citem {
    position: relative; cursor: pointer; padding: 9px 36px 9px 12px; border-radius: 10px;
    border: 1px solid transparent; background: rgba(255,255,255,.03);
  }
  .citem:hover { border-color: var(--accent-2); background: rgba(137,87,229,.14); }
  .citem.active { border-color: var(--accent); background: rgba(137,87,229,.22); }
  .citem .ct { display: block; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .citem .cd { display: block; font-size: 12px; color: var(--muted); }
  .citem .del { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); padding: 0 8px; border-radius: 6px; border-color: transparent; background: transparent; color: var(--muted); font-size: 18px; line-height: 1.4; }
  .citem .del:hover { color: var(--warn); border-color: var(--warn); }
  #drawer .clear { color: var(--muted); font-size: 13px; }
  #drawer .clear:hover { color: var(--warn); border-color: var(--warn); }

  /* ---------- settings ---------- */
  dialog { border: 1px solid var(--accent); border-radius: 16px; background: var(--panel); color: var(--ink); width: min(640px, 92vw); padding: 20px; box-shadow: 0 20px 80px rgba(137,87,229,.35); }
  dialog::backdrop { background: rgba(5,2,12,.7); backdrop-filter: blur(3px); }
  dialog h2 { margin: 0 0 14px; font: 600 20px var(--script); letter-spacing: .08em; color: var(--pop); }
  dialog textarea { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 10px; font: 13px/1.5 var(--mono); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; }
  .field input[type="text"] { width: 100%; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  @media (prefers-reduced-motion: reduce) {
    .ring, .think i { animation: none; }
  }
</style>
</head>
<body>

<header>
  <button id="openHistory" class="icon-btn" title="History" aria-label="History"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></button>
  <h1>Ouroboros</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">checking Ollama…</span></div>
  <div class="spacer"></div>
  <select id="modelSelect" aria-label="Model"></select>
  <button id="newChat" class="new-btn" title="New chat" aria-label="New chat"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Chat</span></button>
  <button id="openSettings" class="icon-btn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</header>

<main id="scroll">
  <div class="thread" id="thread"></div>
</main>

<footer>
  <div class="composer">
    <div class="attach" id="attach">
      <div>
        <label for="codeIn">Your code</label>
        <textarea id="codeIn" spellcheck="false" placeholder="Paste the code here"></textarea>
      </div>
      <div>
        <label for="errIn">Exact terminal output or error</label>
        <textarea id="errIn" spellcheck="false" placeholder="Paste the full traceback or output"></textarea>
      </div>
    </div>
    <div class="row">
      <textarea id="msgIn" rows="1" placeholder="Ask about Python. Enter to send, Shift+Enter for a new line."></textarea>
      <button id="toggleAttach" class="ghost" title="Add code and error output">+ Code</button>
      <button id="stop" class="ghost" style="display:none">Stop</button>
      <button id="send" class="primary">Send</button>
    </div>
  </div>
</footer>

<div id="scrim"></div>
<aside id="drawer" aria-label="Chat history">
  <div class="dhead"><h2>History</h2><button id="closeDrawer">Close</button></div>
  <button id="drawerNew" class="primary">New chat</button>
  <div id="chatList"></div>
  <button id="clearAll" class="clear">Delete all chats</button>
</aside>

<dialog id="settings">
  <h2>Settings</h2>
  <div class="field">
    <label for="hostIn">Ollama address</label>
    <input type="text" id="hostIn">
  </div>
  <div class="field">
    <label for="sysIn">System prompt</label>
    <textarea id="sysIn" rows="9"></textarea>
  </div>
  <div class="grid2">
    <div class="field"><label for="tempIn">Temperature</label><input type="number" id="tempIn" step="0.1" min="0" max="2"></div>
    <div class="field"><label for="ctxIn">Context size (tokens)</label><input type="number" id="ctxIn" step="512" min="1024"></div>
    <div class="field"><label for="maxIn">Max reply (tokens)</label><input type="number" id="maxIn" step="128" min="64"></div>
  </div>
  <div class="actions">
    <button id="resetSettings">Reset to defaults</button>
    <button id="closeSettings" class="primary">Save</button>
  </div>
</dialog>

<script>
const DEFAULTS = {
  host: "http://localhost:11434",
  model: "Python_tutor.v1.2:latest",
  temperature: 0.3,
  numCtx: 4096,
  numPredict: 1024,
  system:
`You are Ouroboros, a Python tutor. You help students understand and fix their Python code.
- Explain the cause of a problem before showing a fix.
- Ask for the full code and the exact terminal output or traceback if the student has not given them. Do not guess about runtime behavior.
- You cannot run code. Reason from the code and the output you are given.
- If the code is already correct, say so. Do not invent bugs.
- Put all code in fenced code blocks with the language name.
- Keep answers short and concrete. Reply in the language the student writes in.`
};

const $ = id => document.getElementById(id);
let settings = Object.assign({}, DEFAULTS, safeParse(localStorage.getItem("pt-settings")));
let chats = safeParse(localStorage.getItem("pt-chats")) || [];
let currentId = localStorage.getItem("pt-current") || null;
let history = [];
let controller = null;

function safeParse(s) { try { return JSON.parse(s) || null; } catch { return null; } }
function titleOf(msgs) {
  const u = msgs.find(m => m.role === "user");
  if (!u) return "New chat";
  let t = u.content.split("\n\nMy code:")[0].split("\n")[0].trim();
  if (!t) t = "Code question";
  return t.length > 48 ? t.slice(0, 48) + "…" : t;
}
function mkChat(msgs) {
  return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: titleOf(msgs), updated: Date.now(), messages: msgs };
}
function save() {
  try {
    if (history.length) {
      let c = chats.find(x => x.id === currentId);
      if (!c) { c = mkChat(history); currentId = c.id; chats.unshift(c); }
      c.messages = history; c.updated = Date.now(); c.title = titleOf(history);
    }
    localStorage.setItem("pt-settings", JSON.stringify(settings));
    localStorage.setItem("pt-chats", JSON.stringify(chats));
    localStorage.setItem("pt-current", currentId || "");
  } catch {}
}
// first run after the history feature: keep the single chat saved by the older version
(function migrate() {
  const old = safeParse(localStorage.getItem("pt-history"));
  if (!chats.length && old && old.length) { const c = mkChat(old); chats.push(c); currentId = c.id; }
  const cur = chats.find(c => c.id === currentId);
  history = cur ? cur.messages : [];
  if (!cur) currentId = null;
})();

/* ---------- the ouroboros ---------- */
let ringId = 0;
function ringSVG(size, cls = "") {
  const id = "rg" + (++ringId);
  const pt = (th, r = 70) => { const a = th * Math.PI / 180; return [100 + r * Math.cos(a), 100 + r * Math.sin(a)]; };
  const arc = (t0, t1) => {
    const [x0, y0] = pt(t0), [x1, y1] = pt(t1);
    const large = (t1 - t0) > 180 ? 1 : 0;
    return `M${x0.toFixed(2)} ${y0.toFixed(2)}A70 70 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };
  // body segments from the tapering tail around to the head
  const segs = [[288, 330, 6], [330, 372, 9], [372, 630, 14]];
  const body = segs.map(([a, b, w]) =>
    `<path d="${arc(a, b)}" stroke="url(#${id})" stroke-width="${w}" fill="none" stroke-linecap="round"/>`).join("");
  const scales = segs.map(([a, b, w]) =>
    `<path d="${arc(a, b)}" stroke="rgba(255,255,255,.28)" stroke-width="${w - 2}" fill="none" stroke-dasharray="1.2 5.4"/>`).join("");
  const hth = 277, [hx, hy] = pt(hth);
  const head =
    `<g transform="rotate(${hth + 90} ${hx.toFixed(2)} ${hy.toFixed(2)})">` +
    `<ellipse cx="${hx.toFixed(2)}" cy="${hy.toFixed(2)}" rx="15" ry="11" fill="url(#${id})"/>` +
    `<circle cx="${(hx + 5).toFixed(2)}" cy="${(hy - 4).toFixed(2)}" r="2.6" fill="#0a0514"/>` +
    `<circle cx="${(hx + 5.8).toFixed(2)}" cy="${(hy - 4.8).toFixed(2)}" r=".9" fill="#fff"/></g>`;
  return `<svg class="ring ${cls}" viewBox="0 0 200 200" width="${size}" height="${size}" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8957e5"/><stop offset=".55" stop-color="#a371f7"/><stop offset="1" stop-color="#ea80fc"/>
    </linearGradient></defs>${body}${scales}${head}</svg>`;
}

/* ---------- rendering ---------- */
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function inline(t) {
  return esc(t)
    .replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
}

function renderText(chunk) {
  const lines = chunk.split("\n");
  let out = "", list = null, para = [];
  const flushPara = () => { if (para.length) { out += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
  const flushList = () => { if (list) { out += `<${list.t}>` + list.items.map(i => "<li>" + inline(i) + "</li>").join("") + `</${list.t}>`; list = null; } };
  for (const raw of lines) {
    const l = raw.trimEnd();
    const ul = l.match(/^\s*[-*]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul || ol) {
      flushPara();
      const t = ul ? "ul" : "ol";
      if (list && list.t !== t) flushList();
      if (!list) list = { t, items: [] };
      list.items.push((ul || ol)[1]);
    } else if (!l.trim()) { flushPara(); flushList(); }
    else { flushList(); para.push(l.trim()); }
  }
  flushPara(); flushList();
  return out;
}

const PY_KW = "False|None|True|and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield";
const PY_BI = "print|len|range|int|str|float|list|dict|set|tuple|input|open|sum|min|max|sorted|enumerate|zip|map|filter|abs|round|type|isinstance|self";
const PY_RE = new RegExp(
  `(#[^\\n]*)|("""[\\s\\S]*?(?:"""|$)|'''[\\s\\S]*?(?:'''|$)|"(?:\\\\.|[^"\\\\\\n])*"?|'(?:\\\\.|[^'\\\\\\n])*'?)|\\b(${PY_KW})\\b|\\b(${PY_BI})\\b(?=\\s*\\()|\\b(\\d+(?:\\.\\d+)?)\\b|\\b([A-Za-z_]\\w*)(?=\\s*\\()`, "g");

function highlight(code, lang) {
  if (lang && !/^(python|py|python3|)$/i.test(lang)) return esc(code);
  let out = "", last = 0, m;
  PY_RE.lastIndex = 0;
  while ((m = PY_RE.exec(code))) {
    if (m[0] === "") { PY_RE.lastIndex++; continue; }
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : m[4] ? "b" : m[5] ? "n" : "f";
    out += `<span class="t-${cls}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

function render(md) {
  const parts = md.split("```");
  let html = "";
  parts.forEach((p, i) => {
    if (i % 2 === 0) { html += renderText(p); return; }
    const nl = p.indexOf("\n");
    const lang = nl === -1 ? p.trim() : p.slice(0, nl).trim();
    const code = nl === -1 ? "" : p.slice(nl + 1).replace(/\n$/, "");
    html += `<div class="codeblock"><div class="bar"><span>${esc(lang || "text")}</span><button class="copy" type="button">Copy</button></div><pre><code>${highlight(code, lang)}</code></pre></div>`;
  });
  return html;
}

// Embedded logo; falls back to the animated snake ring if it fails to load.
function heroMark() {
  const box = $("heroMark");
  const img = new Image();
  img.alt = "Ouroboros logo";
  img.onload = () => { box.innerHTML = ""; box.appendChild(img); };
  img.onerror = () => { box.innerHTML = ringSVG(230, "live") + '<span class="core">&gt;_</span>'; };
  img.src = LOGO;
  box.innerHTML = ringSVG(230, "live") + '<span class="core">&gt;_</span>';
}

function paint() {
  const thread = $("thread");
  if (!history.length) {
    thread.innerHTML = `<div class="hero">
      <div class="big" id="heroMark"></div>
      <h2>Ouroboros</h2>
      <p>Paste your code and the exact error you got. It reads both, explains what went wrong, and shows the fix.</p>
      <div class="chips">${CHIPS.map((c, i) => `<button class="chip" data-i="${i}">${esc(c.label)}</button>`).join("")}</div>
    </div>`;
    heroMark();
    return;
  }
  thread.innerHTML = "";
  history.forEach(m => thread.appendChild(bubble(m)));
  scrollDown();
}

function bubble(m) {
  const d = document.createElement("div");
  d.className = "msg " + m.role;
  if (m.role === "user") d.innerHTML = render(m.content);
  else {
    d.innerHTML = `<div class="body">${fmt(m)}</div>`;
  }
  const host = m.role === "user" ? d : d.querySelector(".body");
  if (m.meta) host.insertAdjacentHTML("beforeend", `<div class="meta">${esc(m.meta)}</div>`);
  if (m.error) host.insertAdjacentHTML("beforeend", `<div class="meta error">${esc(m.error)}</div>`);
  return d;
}

function scrollDown() { const s = $("scroll"); s.scrollTop = s.scrollHeight; }

$("thread").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) {
    const c = CHIPS[chip.dataset.i];
    $("msgIn").value = c.text; autosize();
    $("attach").classList.toggle("open", c.attach);
    (c.attach ? $("codeIn") : $("msgIn")).focus();
    return;
  }
  if (!e.target.classList.contains("copy")) return;
  const code = e.target.closest(".codeblock").querySelector("code").textContent;
  navigator.clipboard.writeText(code).then(() => {
    e.target.textContent = "Copied";
    setTimeout(() => (e.target.textContent = "Copy"), 1200);
  });
});

/* ---------- prompt building (ChatML, sent raw so the Modelfile template is bypassed) ---------- */
function buildPrompt() {
  const budgetChars = settings.numCtx * 3 - settings.system.length - settings.numPredict * 3;
  let used = 0, keep = [];
  for (let i = history.length - 1; i >= 0; i--) {
    const m = history[i];
    if (m.error) continue;
    used += m.content.length + 20;
    if (used > budgetChars && keep.length) break;
    keep.unshift(m);
  }
  let p = `<|im_start|>system\n${settings.system}<|im_end|>\n`;
  for (const m of keep) {
    if (m.role === "assistant" && !m.content) continue;
    p += `<|im_start|>${m.role}\n${m.content}<|im_end|>\n`;
  }
  return p + "<|im_start|>assistant\n";
}

/* ---------- chat ---------- */
async function send() {
  if (controller) return;
  const text = $("msgIn").value.trim();
  const code = $("codeIn").value.trim();
  const err = $("errIn").value.trim();
  if (!text && !code && !err) return;

  let content = text;
  if (code) content += (content ? "\n\n" : "") + "My code:\n```python\n" + code + "\n```";
  if (err) content += (content ? "\n\n" : "") + "Terminal output:\n```\n" + err + "\n```";

  history.push({ role: "user", content });
  const reply = { role: "assistant", content: "" };
  history.push(reply);
  $("msgIn").value = ""; $("codeIn").value = ""; $("errIn").value = "";
  $("attach").classList.remove("open");
  autosize();
  paint();

  const prompt = buildPrompt();
  const node = $("thread").lastElementChild;
  const body = node.querySelector(".body");
  controller = new AbortController();
  setBusy(true);
  const t0 = performance.now();
  let tokens = 0;

  try {
    const res = await fetch(settings.host + "/api/generate", {
      method: "POST",
      signal: controller.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: $("modelSelect").value || settings.model,
        prompt,
        raw: true,
        stream: true,
        options: {
          temperature: Number(settings.temperature),
          num_ctx: Number(settings.numCtx),
          num_predict: Number(settings.numPredict),
          stop: ["<|im_end|>", "<|im_start|>"]
        }
      })
    });
    if (!res.ok) throw new Error(`Ollama returned ${res.status}: ${await res.text()}`);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const j = JSON.parse(line);
        if (j.response) { reply.content += j.response; tokens++; }
        body.innerHTML = fmt(reply);
        scrollDown();
        if (j.done && j.eval_count) tokens = j.eval_count;
      }
    }
  } catch (e) {
    if (e.name === "AbortError") reply.meta = "Stopped";
    else reply.error = explain(e);
  } finally {
    if (!reply.error && !reply.meta) {
      const s = (performance.now() - t0) / 1000;
      reply.meta = `${tokens} tokens in ${s.toFixed(1)}s (${(tokens / Math.max(s, .1)).toFixed(1)} tok/s)`;
    }
    controller = null;
    setBusy(false);
    save();
    paint();
  }
}

function explain(e) {
  if (e instanceof TypeError)
    return "Could not reach Ollama at " + settings.host + ". Check that it is running and that this page is opened from http://localhost, not from a file.";
  return e.message;
}

function setBusy(b) {
  document.body.classList.toggle("busy", b);
  $("send").disabled = b;
  $("stop").style.display = b ? "" : "none";
}

/* ---------- models + status ---------- */
async function loadModels() {
  try {
    const r = await fetch(settings.host + "/api/tags");
    const j = await r.json();
    const names = j.models.map(m => m.name).filter(n => !/embed/i.test(n));
    const sel = $("modelSelect");
    sel.innerHTML = names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
    sel.value = names.includes(settings.model) ? settings.model : names[0];
    $("dot").className = "dot on";
    $("statusText").textContent = "Ollama connected";
  } catch {
    $("dot").className = "dot off";
    $("statusText").textContent = "Ollama not reachable";
    $("modelSelect").innerHTML = `<option>${esc(settings.model)}</option>`;
  }
}
$("modelSelect").addEventListener("change", e => { settings.model = e.target.value; save(); });

/* ---------- UI wiring ---------- */
function autosize() {
  const t = $("msgIn");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 200) + "px";
}
$("msgIn").addEventListener("input", autosize);
$("msgIn").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("send").addEventListener("click", send);
$("stop").addEventListener("click", () => controller && controller.abort());
$("toggleAttach").addEventListener("click", () => $("attach").classList.toggle("open"));
function startNew() {
  if (controller) controller.abort();
  save();
  history = []; currentId = null; save(); paint();
}
function openChat(id) {
  const c = chats.find(x => x.id === id);
  if (!c) return;
  if (controller) controller.abort();
  save();
  currentId = c.id; history = c.messages; save(); paint();
}
function deleteChat(id) {
  chats = chats.filter(c => c.id !== id);
  if (id === currentId) { if (controller) controller.abort(); history = []; currentId = null; paint(); }
  save(); renderList();
}
function renderList() {
  const list = $("chatList");
  const sorted = [...chats].sort((a, b) => b.updated - a.updated);
  if (!sorted.length) { list.innerHTML = '<p class="dempty">No past chats yet. Your conversations will appear here.</p>'; return; }
  list.innerHTML = sorted.map(c => {
    const d = new Date(c.updated).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    return `<div class="citem${c.id === currentId ? " active" : ""}" data-id="${esc(c.id)}" tabindex="0" role="button">
      <span class="ct">${esc(c.title)}</span><span class="cd">${esc(d)}</span>
      <button class="del" type="button" aria-label="Delete chat">×</button></div>`;
  }).join("");
}
function openDrawer() { renderList(); $("drawer").classList.add("open"); $("scrim").classList.add("open"); }
function closeDrawer() { $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); }

$("newChat").addEventListener("click", startNew);
$("drawerNew").addEventListener("click", () => { startNew(); closeDrawer(); });
$("openHistory").addEventListener("click", openDrawer);
$("closeDrawer").addEventListener("click", closeDrawer);
$("scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
$("clearAll").addEventListener("click", () => {
  if (!chats.length || !confirm("Delete all saved chats?")) return;
  if (controller) controller.abort();
  chats = []; history = []; currentId = null; save(); paint(); renderList();
});
$("chatList").addEventListener("click", e => {
  const item = e.target.closest(".citem");
  if (!item) return;
  if (e.target.closest(".del")) { if (confirm("Delete this chat?")) deleteChat(item.dataset.id); return; }
  openChat(item.dataset.id); closeDrawer();
});
$("chatList").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList.contains("citem")) { openChat(e.target.dataset.id); closeDrawer(); }
});

function fillSettings() {
  $("hostIn").value = settings.host;
  $("sysIn").value = settings.system;
  $("tempIn").value = settings.temperature;
  $("ctxIn").value = settings.numCtx;
  $("maxIn").value = settings.numPredict;
}
$("openSettings").addEventListener("click", () => { fillSettings(); $("settings").showModal(); });
$("closeSettings").addEventListener("click", () => {
  settings.host = $("hostIn").value.trim().replace(/\/$/, "") || DEFAULTS.host;
  settings.system = $("sysIn").value;
  settings.temperature = $("tempIn").value;
  settings.numCtx = $("ctxIn").value;
  settings.numPredict = $("maxIn").value;
  save(); $("settings").close(); loadModels();
});
$("resetSettings").addEventListener("click", () => {
  settings = Object.assign({}, DEFAULTS, { model: settings.model });
  fillSettings();
});

paint();
loadModels();
</script>
</body>
</html>
